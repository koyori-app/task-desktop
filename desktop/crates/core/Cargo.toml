[package]
name = "core"
edition.workspace = true
license.workspace = true

# クレート名 `core` が doctest 時の `--extern core=…` で組み込み core を
# 退避させて thiserror 等の展開を壊すため、doctest を無効化する。
[lib]
doctest = false

[dependencies]
api = { path = "../api" }
platform = { path = "../platform" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
url = "2"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
