[package]
name = "mock-api"
edition.workspace = true
license.workspace = true
description = "Spec-conformant local mock of the Koyori backend for manual desktop testing"

[[bin]]
name = "koyori-mock"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = "0.4"
base64 = "0.22"

[dev-dependencies]
api = { path = "../api" }
